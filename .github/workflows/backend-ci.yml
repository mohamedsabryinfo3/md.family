# MD.Family Backend — CI pipeline
# Runs lint, tests, and Docker build on every push/PR.

name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint with ruff
        run: ruff check app/ tests/
        continue-on-error: true

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run pytest
        env:
          MDFAMILY_DATABASE_URL: "sqlite+aiosqlite:////tmp/test_mdfamily.db"
          MDFAMILY_JWT_SECRET: "ci-test-secret-do-not-use-in-prod"
          MDFAMILY_REDIS_URL: ""
          MDFAMILY_CORS_ORIGINS: "http://localhost:3000"
          MDFAMILY_APP_ENV: "testing"
          MDFAMILY_APP_DEBUG: "false"
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: mdfamily-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        run: |
          docker run --rm -d --name mdfamily-ci -p 8000:8000 \
            -e MDFAMILY_APP_ENV=production \
            -e MDFAMILY_JWT_SECRET=ci-test \
            -e MDFAMILY_DATABASE_URL="sqlite+aiosqlite:///./mdfamily.db" \
            -e MDFAMILY_REDIS_URL="" \
            -e MDFAMILY_CORS_ORIGINS="http://localhost:3000" \
            mdfamily-backend:ci-${{ github.sha }}
          sleep 8
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          docker stop mdfamily-ci
