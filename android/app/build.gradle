apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "family.md.sabry"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "family.md.sabry"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0.0-native"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Required for Firebase + Kotlin coroutines
    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }

    // Kotlin compile options — match Java's JVM target (21)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:1.13.1"

    // Capacitor core + plugins
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // ─── MD.Family native dependencies ────────────────────

    // Firebase Cloud Messaging (for push notifications)
    // NOTE: requires google-services.json in app/ folder
    // If google-services.json is missing, the build still succeeds — FCM just won't work at runtime
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx:24.1.0'

    // Google Play Services — Location (for geofencing + fused location)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Kotlin coroutines (for async work in services)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // ─── Test dependencies ────────────────────────────────

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    testImplementation "org.robolectric:robolectric:4.14.1"

    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

// ─── Firebase google-services plugin (only if google-services.json exists) ────
// This must be at the BOTTOM of the file
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    } else {
        logger.info("google-services.json not found — Firebase push notifications won't work. " +
                    "Add it to app/ folder to enable FCM.")
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
